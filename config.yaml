dataset:
  name: msmarco
  raw_path: "data/raw"
  processed_path: "data/processed"
  index_path: "data/index"
  max_documents: 300
  max_queries: 50
  split: "train"
  min_doc_length: 20

embedding:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  batch_size: 32
  normalize: true
  device: "auto"

retrieval:
  top_k: 10
  bm25_k1: 1.5
  bm25_b: 0.75
  hybrid_alpha: 0.5
  index_type: "IndexFlatIP"
  distance_metric: "cosine"

reranking:
  enabled: true
  model_name: "BAAI/bge-reranker-v2-m3"
  batch_size: 16

generation:
  provider: "ollama"
  model_name: "qwen3:8b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  timeout_seconds: 120
  max_context_characters: 12000

system:
  device: "auto"
  seed: 42
